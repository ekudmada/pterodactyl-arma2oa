[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/arma2oaserver.pid
childlogdir=/tmp

[program:Xvfb]
command=Xvfb :0 -screen 0 800x600x24
autorestart=true
priority=1

[program:Xvfb-2]
command=Xvfb :1 -screen 0 1280x960x24
priority=2
autostart=%(ENV_HEADLESS_CLIENT)s

[program:arma2oaserver]
directory=/home/container
command=bash -c 'eval "exec wine arma2oaserver.exe ${ARMA_CMDLINE}"'
priority=3
autorestart=true
environment=DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:arma2client]
directory=/home/container
command=bash -c 'wine ArmA2OA.exe -client -connect=127.0.0.1 -port=%(ENV_SERVER_PORT)s -nosound'
priority=4
autostart=%(ENV_HEADLESS_CLIENT)s
environment=DISPLAY=":1"

; Pterodactyl: the dedicated server writes its console to logFile (server.cfg), not stdout
[program:console]
directory=/home/container
command=bash -c 'tail -q -n 0 -F server_console.log "${PROFILES_DIR}/server_console.log" 2>/dev/null'
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Pterodactyl: stream the server's RPT log too, prefixed so it stands apart from the console
[program:rpt]
directory=/home/container
command=bash -c 'tail -q -n 0 -F "${PROFILES_DIR}/arma2oaserver.RPT" 2>/dev/null | sed -u "s/^/[RPT] /"'
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
